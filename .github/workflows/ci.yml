# The repo's own checks (tools/ci.sh) on Linux and on macOS.
# Both job names are required status checks in the main-branch ruleset (.github/rulesets/main.json):
# renaming a job or an OS here means updating that ruleset too.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # macOS runners take 15 min or more for the whole suite now
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # uv runs the Python behind bin/vh (music, storyboard, rhythm, cover-preview …); without it those smoke tests skip.
      # Its cache (pillow, numpy, scipy …) is kept between runs, keyed on this file: bump the pins here to refresh it.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install check tools
        timeout-minutes: 10   # half a minute as a rule, two when a mirror stalls; this only stops what the tries below cannot
        run: |
          python3 -m pip install --quiet pyflakes
          if [ "$RUNNER_OS" = Linux ]; then
            # GitHub's runners install from an Azure Ubuntu mirror in their own region. Now and then one serves at a crawl or
            # stops answering: 10 to 30 min instead of half a minute on 2026-10-25 and 26, in westus3 above all (known upstream:
            # actions/runner-images#14823, open). A probe put the time in the download (93 MB in 12 min; dpkg took 7 s), and
            # apt's own 15 s timeout did not fail over. So the stages that fetch have a time limit, and a try that runs over is
            # killed and repeated without that mirror, from archive.ubuntu.com (the second line of /etc/apt/apt-mirrors.txt).
            # What was downloaded is kept. dpkg runs last, on files that are all local, and has no limit: it was never the slow
            # part, and a dpkg killed half way keeps running on its own and holds the lock.
            aptget() {   # aptget <seconds, 0 for no limit> <apt-get arguments>: one apt-get, with how long it took
              s=$SECONDS; sudo timeout -k 5 "$1" apt-get -y -q "${@:2}" >/tmp/apt.log 2>&1; r=$?
              echo "apt-get ${*:2}: $((SECONDS - s)) s, exit $r"; return $r
            }
            for try in 1 2 3; do
              aptget 60 update && aptget 60 install --download-only shellcheck ffmpeg && aptget 0 install shellcheck ffmpeg && break
              tail -n 5 /tmp/apt.log
              [ $try = 3 ] && exit 1
              sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt || true
              sudo dpkg --configure -a || true   # after a dpkg that failed, not one that was killed
            done
          else   # ffmpeg lets the bin/vh mux/gif smoke tests run under macOS /bin/bash 3.2 too
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet ffmpeg >/dev/null
          fi
      # Linux: GNU userland. macOS: BSD userland, and bin/vh runs under the system /bin/bash 3.2 that Mac users have.
      - name: tools/ci.sh
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export VH_BASH=/bin/bash; fi
          tools/ci.sh
