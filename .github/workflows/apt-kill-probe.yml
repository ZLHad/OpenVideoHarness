# THROWAWAY: the install step with 5 s for the first dpkg stage, so that dpkg is killed half way and repaired. Not part of the PR.
name: apt-kill-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/ci-apt-install]
    paths: [.github/workflows/apt-kill-probe.yml]
permissions:
  contents: read
jobs:
  kill:
    name: kill ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: the install step of ci.yml, with 5 s for the dpkg stage of the first try
        run: |
          yq '.jobs.checks.steps[] | select(.name == "Install check tools") | .run' .github/workflows/ci.yml | sed 's/aptget 120 install/aptget $((try == 1 ? 5 : 120)) install/' > /tmp/install.sh
          grep -n 'try == 1' /tmp/install.sh
          start=$SECONDS; rc=0
          RUNNER_OS=Linux bash -e /tmp/install.sh || rc=$?
          echo "KILLPROBE n=${{ matrix.n }} step=$((SECONDS - start)) exit=$rc"
          echo "KILLPROBE dpkg --audit says: [$(sudo dpkg --audit)]"
          dpkg -l ffmpeg shellcheck | tail -2
          ffmpeg -version | head -1
          shellcheck --version | sed -n 2p
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=duration=1:size=64x64:rate=5 -c:v libx264 -y /tmp/t.mp4 && echo "KILLPROBE ffmpeg encodes with libx264: ok"
          exit $rc
