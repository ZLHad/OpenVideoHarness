<svg xmlns="http://www.w3.org/2000/svg" width="720" height="716" viewBox="0 0 720 716" role="img"><title>OpenVideoHarness 全局图</title><desc>一句话需求经过判断类型、三道人工关卡、声音先行的代码渲染和自查闭环变成成片；右侧是仓库提供的知识库、工具与引擎、记录与经验回流。</desc>
<style>
.t{font:500 14px system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.s{font:400 12px system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
rect{stroke-width:0.8}
.pu rect{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#3C3489}.pu .s{fill:#534AB7}
.co rect{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#712B13}.co .s{fill:#993C1D}
.te rect{fill:#E1F5EE;stroke:#0F6E56}.te .t{fill:#085041}.te .s{fill:#0F6E56}
.gr rect{fill:#F1EFE8;stroke:#5F5E5A}.gr .t{fill:#444441}.gr .s{fill:#5F5E5A}
.ar{stroke:#888780;stroke-width:1.2;fill:none}.ld{stroke:#888780;stroke-width:0.8;stroke-dasharray:4 3;fill:none}
.ah{stroke:#888780;fill:none}.lg{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.pu rect{fill:#3C3489;stroke:#AFA9EC}.pu .t{fill:#EEEDFE}.pu .s{fill:#CECBF6}
.co rect{fill:#712B13;stroke:#F0997B}.co .t{fill:#FAECE7}.co .s{fill:#F5C4B3}
.te rect{fill:#085041;stroke:#5DCAA5}.te .t{fill:#E1F5EE}.te .s{fill:#9FE1CB}
.gr rect{fill:#444441;stroke:#B4B2A9}.gr .t{fill:#F1EFE8}.gr .s{fill:#D3D1C7}
.ar,.ld,.ah{stroke:#B4B2A9}.lg{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gr"><rect x="135.0" y="30" width="180" height="40" rx="5"/><text class="t" x="225.0" y="55.0" text-anchor="middle">一句话需求</text></g>
<line class="ar" x1="225.0" y1="70" x2="225.0" y2="98" marker-end="url(#a)"/>
<g class="pu"><rect x="60" y="100" width="330" height="52" rx="5"/><text class="t" x="225.0" y="122" text-anchor="middle">判断类型，定档位</text><text class="s" x="225.0" y="140" text-anchor="middle">8 类视频 · quick / standard / studio</text></g>
<line class="ar" x1="225.0" y1="152" x2="225.0" y2="182" marker-end="url(#a)"/>
<g class="co"><rect x="60" y="184" width="330" height="52" rx="5"/><text class="t" x="225.0" y="206" text-anchor="middle">关卡①：大纲与风格</text><text class="s" x="225.0" y="224" text-anchor="middle">给 2–3 个风格样片让你挑</text></g>
<line class="ar" x1="225.0" y1="236" x2="225.0" y2="266" marker-end="url(#a)"/>
<g class="co"><rect x="60" y="268" width="330" height="52" rx="5"/><text class="t" x="225.0" y="290" text-anchor="middle">关卡②：分镜</text><text class="s" x="225.0" y="308" text-anchor="middle">每镜一张关键帧，看图判断</text></g>
<line class="ar" x1="225.0" y1="320" x2="225.0" y2="350" marker-end="url(#a)"/>
<g class="pu"><rect x="60" y="352" width="330" height="52" rx="5"/><text class="t" x="225.0" y="374" text-anchor="middle">声音先行，再写画面</text><text class="s" x="225.0" y="392" text-anchor="middle">配音配乐定时长，每帧是 t 的纯函数</text></g>
<line class="ar" x1="225.0" y1="404" x2="225.0" y2="434" marker-end="url(#a)"/>
<g class="pu"><rect x="60" y="436" width="330" height="52" rx="5"/><text class="t" x="225.0" y="458" text-anchor="middle">自查闭环</text><text class="s" x="225.0" y="476" text-anchor="middle">联系表、音频 QA、7 项打分都到 8</text></g>
<line class="ar" x1="225.0" y1="488" x2="225.0" y2="518" marker-end="url(#a)"/>
<g class="co"><rect x="60" y="520" width="330" height="52" rx="5"/><text class="t" x="225.0" y="542" text-anchor="middle">关卡③：初版</text><text class="s" x="225.0" y="560" text-anchor="middle">附上它自己最不满意的 3 处</text></g>
<line class="ar" x1="225.0" y1="572" x2="225.0" y2="602" marker-end="url(#a)"/>
<g class="gr"><rect x="105.0" y="604" width="240" height="40" rx="5"/><text class="t" x="225.0" y="629.0" text-anchor="middle">成片：可复现、可修改</text></g>
<path class="ar" d="M60 462 H44 V388 H58" marker-end="url(#a)"/>
<path class="ar" d="M60 546 H26 V370 H58" marker-end="url(#a)"/>
<g class="te"><rect x="450" y="100" width="230" height="124" rx="5"/><text class="t" x="565.0" y="124" text-anchor="middle">知识库</text><text class="s" x="565.0" y="148" text-anchor="middle">8 类视频 · 11 篇 playbook</text><text class="s" x="565.0" y="168" text-anchor="middle">28 种风格，都有样片</text><text class="s" x="565.0" y="188" text-anchor="middle">11 个案例拆解</text><text class="s" x="565.0" y="208" text-anchor="middle">30 个参考仓库</text></g>
<line class="ld" x1="450" y1="126" x2="390" y2="126"/>
<line class="ld" x1="450" y1="210" x2="390" y2="210"/>
<g class="te"><rect x="450" y="352" width="230" height="124" rx="5"/><text class="t" x="565.0" y="376" text-anchor="middle">工具与引擎</text><text class="s" x="565.0" y="400" text-anchor="middle">bin/vh 二十多个命令</text><text class="s" x="565.0" y="420" text-anchor="middle">HyperFrames · Manim</text><text class="s" x="565.0" y="440" text-anchor="middle">p5.brush 手绘引擎</text><text class="s" x="565.0" y="460" text-anchor="middle">作曲 · 配音 · 混音 · QA</text></g>
<line class="ld" x1="450" y1="378" x2="390" y2="378"/>
<line class="ld" x1="450" y1="462" x2="390" y2="462"/>
<g class="te"><rect x="450" y="520" width="230" height="120" rx="5"/><text class="t" x="565.0" y="544" text-anchor="middle">记录与回流</text><text class="s" x="565.0" y="568" text-anchor="middle">REVIEW.md 记下每条意见</text><text class="s" x="565.0" y="588" text-anchor="middle">LESSONS 回流进 playbook</text><text class="s" x="565.0" y="608" text-anchor="middle">下一支片子直接受益</text></g>
<line class="ld" x1="450" y1="546" x2="390" y2="546"/>
<line class="ld" x1="450" y1="624" x2="345.0" y2="624"/>
<g class="co"><rect x="60" y="664" width="12" height="12" rx="2"/></g><text class="s lg" x="78" y="674">你来拍板</text>
<g class="pu"><rect x="180" y="664" width="12" height="12" rx="2"/></g><text class="s lg" x="198" y="674">agent 执行</text>
<g class="te"><rect x="300" y="664" width="12" height="12" rx="2"/></g><text class="s lg" x="318" y="674">仓库提供</text>
