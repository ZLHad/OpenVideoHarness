<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img"><title>OpenVideoHarness 项目结构</title><desc>从一句话需求到成片：agent 读 CLAUDE.md 路由，查阅类型文档、通用知识、模板和案例，在 projects 里建项目并经过三道人工审阅，调用渲染引擎出片，经验写回 LESSONS.md。</desc>
<style>
.t{font:500 14px system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.s{font:400 12px system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
rect{stroke-width:0.8}
.pu rect{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#3C3489}.pu .s{fill:#534AB7}
.te rect{fill:#E1F5EE;stroke:#0F6E56}.te .t{fill:#085041}.te .s{fill:#0F6E56}
.gr rect{fill:#F1EFE8;stroke:#5F5E5A}.gr .t{fill:#444441}.gr .s{fill:#5F5E5A}
.am rect{fill:#FAEEDA;stroke:#854F0B}.am .t{fill:#633806}.am .s{fill:#854F0B}
.ar{stroke:#888780;stroke-width:1.2;fill:none}.ah{stroke:#888780;fill:none}.lg{fill:#5F5E5A}
