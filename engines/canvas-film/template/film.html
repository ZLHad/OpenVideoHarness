<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>canvas-film</title>
<style>
  /* Fonts: local() faces only, nothing is downloaded. The engine draws with three families (src/10-draw.js, FAMILIES);
     change the faces here and keep the family names. A face this machine lacks falls back, and ready names it. */
  @font-face { font-family: "Film Sans"; src: local("PingFangSC-Regular"), local("PingFang SC Regular"), local("NotoSansCJKsc-Regular"), local("Noto Sans CJK SC"), local("SourceHanSansSC-Regular"), local("Microsoft YaHei"); font-weight: 400; }
  @font-face { font-family: "Film Sans"; src: local("PingFangSC-Semibold"), local("PingFang SC Semibold"), local("NotoSansCJKsc-Bold"), local("Noto Sans CJK SC Bold"), local("SourceHanSansSC-Bold"), local("Microsoft YaHei Bold"); font-weight: 600; }
  @font-face { font-family: "Film Serif"; src: local("STSongti-SC-Bold"), local("Songti SC Bold"), local("NotoSerifCJKsc-Bold"), local("Noto Serif CJK SC Bold"), local("SourceHanSerifSC-Bold"); font-weight: 700; }
  @font-face { font-family: "Film Serif"; src: local("STSongti-SC-Black"), local("Songti SC Black"), local("NotoSerifCJKsc-Black"), local("Noto Serif CJK SC Black"), local("SourceHanSerifSC-Heavy"); font-weight: 900; }
  /* the heaviest Chinese sans of each system, for cover titles (src/20-ui.js coverTitle): Lantinghei SC Heavy (macOS, a font
     macOS downloads when first asked for), Hiragino Sans GB W6 (macOS), Noto Sans CJK SC Black or Source Han Sans SC Heavy
     (Linux: fonts-noto-cjk-extra), Microsoft YaHei Bold (Windows), PingFang SC Semibold (every Mac) last */
  @font-face { font-family: "Film Heavy"; src: local("FZLTTHK--GBK1-0"), local("Lantinghei SC Heavy"), local("HiraginoSansGB-W6"), local("Hiragino Sans GB W6"), local("NotoSansCJKsc-Black"), local("Noto Sans CJK SC Black"), local("SourceHanSansSC-Heavy"), local("Source Han Sans SC Heavy"), local("Microsoft YaHei Bold"), local("PingFangSC-Semibold"); font-weight: 900; }
  @font-face { font-family: "Film Mono"; src: local("Menlo-Regular"), local("Menlo"), local("DejaVuSansMono"), local("DejaVu Sans Mono"), local("Consolas"); font-weight: 400; }
  /* characters the faces above lack, by unicode-range (no other character changes face): Songti SC Black has no − (U+2212)
     or – (U+2013), so the 900 serif takes them from the font the browser fell back to before (Times New Roman Bold on
     macOS); the mono faces have no Chinese, so it comes from the Chinese sans the browser fell back to before */
  @font-face { font-family: "Film Serif"; src: local("NotoSerifCJKsc-Black"), local("Noto Serif CJK SC Black"), local("SourceHanSerifSC-Heavy"), local("TimesNewRomanPS-BoldMT"), local("Times New Roman Bold"), local("DejaVuSerif-Bold"), local("DejaVu Serif Bold"); font-weight: 900; unicode-range: U+2013, U+2212; }
  @font-face { font-family: "Film Mono"; src: local("PingFangSC-Regular"), local("PingFang SC Regular"), local("NotoSansMonoCJKsc-Regular"), local("Noto Sans Mono CJK SC"), local("NotoSansCJKsc-Regular"), local("Noto Sans CJK SC"), local("SourceHanSansSC-Regular"), local("Microsoft YaHei"); font-weight: 400; unicode-range: U+2E80-2FDF, U+3000-31FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF, U+20000-3134F; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #film { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<!-- A canvas-film page (engines/canvas-film/README.md). It draws only when asked: open it with bin/vh frames <project>
     (or bin/vh textcheck), which serves this folder on 127.0.0.1 so the page can fetch audio/timeline.<lang>.json.
     The engine is src/00–30 and src/90; this film is src/50-shots.js. -->
<canvas id="film" width="1920" height="1080"></canvas>
<script src="src/00-core.js"></script>
<script src="src/05-music-clock.js"></script>
<script src="src/06-time-map.js"></script>
<script src="src/10-draw.js"></script>
<script src="src/15-fx.js"></script>
<script src="src/20-ui.js"></script>
<script src="src/30-transitions.js"></script>
<script src="src/50-shots.js"></script>
<script src="src/90-main.js"></script>
</body>
</html>
