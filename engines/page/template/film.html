<!doctype html>
<!-- A film with no engine: this page is the whole film. The one thing it keeps is the page contract, window.film
     (engines/CONTRACT.md); what is drawn, how, and with which library is yours to decide. engines/page/README.md
     (ENGINE_README.md in a project) says what the harness gives a page like this one. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>film</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// ── the frame: bin/vh new writes W and H from the BRIEF's Output line; 4K is this same page rendered at --dpr 2 ──
const W = 1920, H = 1080, FPS = 30, DURATION = 10;
const DPR = window.devicePixelRatio || 1;
const canvas = document.getElementById("c");
canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
const ctx = canvas.getContext("2d");

// ── a few pure helpers; components/lib/core.js has many more (bin/vh components add <project> <name> copies it in) ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));   // 0 until a, 1 from b on
const easeInOut = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const hash = (i) => {   // a number in [0, 1) that only i decides: the randomness a frame may use (never Math.random)
  let x = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
};

// ── time as data: with narration, bin/vh tts writes audio/timeline.<lang>.json, every line and word in seconds.
// Load it in ready() below; then at("a2", "看不到") is when those words start, at("a2", "看不到", "end") when they end.
// Picture that follows the voice takes its times from here, never from seconds typed by hand (hard rule 2).
let TL = null;
const letters = (s) => String(s).normalize("NFKC").replace(/[\s\p{P}\p{S}]/gu, "").toLowerCase();
function at(lineId, text, edge = "start") {
  const line = TL && TL.segments.find((s) => s.id === lineId);
  if (!line) throw new Error(`at(): no line "${lineId}" in the narration timeline (load it in ready)`);
  const L = [];   // every letter of the line, with the word it belongs to
  for (const w of line.words) for (const ch of letters(w.w)) L.push({ ch, w });
  const want = letters(text), k = want ? L.map((x) => x.ch).join("").indexOf(want) : -1;
  if (k < 0) throw new Error(`at(): "${text}" is not in line ${lineId} (${line.text})`);
  return edge === "end" ? L[k + want.length - 1].w.end : L[k].w.start;
}

// ── the film: one pure function of t. Everything in here is a placeholder to replace. ──
function frame(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#7f7f7f"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#1f1f1f"; ctx.fillRect(0, H - 12, W * clamp(t / DURATION), 12);
  ctx.font = `${Math.round(H / 18)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(`film.html · t = ${t.toFixed(2)} s`, W / 2, H / 2);
}

window.film = {
  frame, duration: DURATION, width: W, height: H, fps: FPS,
  ready: async () => {
    // Load fonts, pictures and data here; the host draws only after this resolves. A web font: each face by name,
    // document.fonts.load("700 80px Name") (document.fonts.ready alone is not enough). Narration, when the film has it:
    // TL = await (await fetch("audio/timeline.zh.json")).json();
  },
  texts: [],   // [{text, start, end}]: each text a viewer must read, from fully shown to gone (bin/vh readcheck, textcheck)
  shots: [],   // [{id, start, end, reads}]: optional, the shots in seconds (bin/vh storyboard draws one frame a shot)
};
</script>
</body>
</html>
