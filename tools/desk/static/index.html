<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="desk-token" content="{{TOKEN}}">
<meta name="desk-home" content="{{HOME}}">
<title>片场 · OpenVideoHarness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111111'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%235ec9dc'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/modules.css">
<link rel="stylesheet" href="/static/agent.css">
<script src="/static/ui.js"></script>
</head>
<body>
<a class="skiplink" href="#stage" id="skip">跳到内容</a>
<div class="app" id="app">
  <header class="topbar">
    <a class="mark" href="#/" id="mark">ovh</a>
    <nav class="crumbs" id="crumbs" aria-label="位置"></nav>
    <ol class="flow" id="flow" aria-label="这支片子的几站"></ol>
    <div class="tools">
      <button type="button" class="btn btn-quiet" id="searchBtn"><span id="searchLabel">搜片子</span> <span class="kbd">/</span></button>
      <details class="tmenu"><summary class="btn btn-quiet" id="themeBtn">主题</summary>
        <div class="themes" role="group" id="themes" aria-label="主题">
          <button type="button" data-theme-set="darkfield" aria-pressed="false">暗场</button><button type="button" data-theme-set="prism" aria-pressed="false">棱镜</button><button type="button" data-theme-set="bridge" aria-pressed="false">舰桥</button>
        </div>
      </details>
      <button type="button" class="btn btn-quiet" id="lang">EN</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="模块"></nav>
  <main class="stage-area" id="stage" tabindex="-1"><p class="loading">…</p></main>
  <aside class="col" id="col" aria-label="这一轮">
    <p class="nokey" id="nokey" role="alert" hidden></p>
    <div class="col-tabs" id="colTabs" role="tablist" hidden></div>
    <section class="agent" id="agentPane" aria-label="agent">
      <div class="ag-head" id="agHead"></div>
      <div class="ag-thread" id="agThread" aria-live="polite"></div>
      <div class="ag-foot" id="agFoot"></div>
    </section>
    <div class="col-head" id="colHead"></div>
    <div class="col-body" id="colBody"></div>
    <div class="composer" id="composer" hidden></div>
    <div class="col-round" id="colRound" hidden></div>
    <div class="confirm" id="confirm" hidden></div>
  </aside>
</div>
<div class="search" id="search" hidden role="dialog" aria-label="搜片子">
  <input id="q" type="search" autocomplete="off" spellcheck="false"><ol class="results" id="results" role="listbox"></ol>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/core.js"></script>
<script src="/static/modules.js"></script>
<script src="/static/agent.js"></script>
<script src="/static/studio.js"></script>
</body>
</html>
