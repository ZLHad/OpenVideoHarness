<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="desk-token" content="{{TOKEN}}">
<meta name="desk-home" content="{{HOME}}">
<title>片场 · OpenVideoHarness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0a09'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23e9b47c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/console.css">
<script src="/static/ui.js"></script>
</head>
<body>
<a class="skip" href="#view" id="skip">跳到内容</a>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#/" id="mark" title="片场">OVH</a>
    <nav class="crumbs" id="crumbs" aria-label="位置"></nav>
    <div class="top-tools">
      <button type="button" class="btn btn-quiet search-btn" id="searchBtn"><span id="searchLabel">搜项目</span> <span class="kbd">/</span></button>
      <span class="live" id="live" hidden><i></i><span id="liveTxt"></span></span>
      <button type="button" class="btn btn-quiet" id="openDrawer" hidden><span class="pen" aria-hidden="true">✎</span><span id="myLabel">我的点评</span> <span class="n" id="cnt">0</span></button>
      <button type="button" class="btn btn-quiet" id="lang">EN</button>
      <button type="button" class="p-btn" id="theme" title="深色 / 浅色" aria-label="深色 / 浅色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="search" id="search" hidden>
    <div class="wrap"><input id="q" type="search" autocomplete="off" spellcheck="false"><ol class="results" id="results" role="listbox"></ol></div>
  </div>
</header>
<main id="view" class="wrap" tabindex="-1"><p class="loading">…</p></main>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <header><h2 id="drawerTitle">提交</h2><button type="button" class="p-btn" id="closeDrawer" aria-label="关闭">×</button></header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer>
    <label class="meta" id="generalLabel" for="general">整体意见（可选）</label>
    <textarea id="general" rows="3"></textarea>
    <div class="drawer-act"><button type="button" class="btn btn-primary" id="submit">提交</button><button type="button" class="btn" id="cancel">再看看</button></div>
    <p class="meta" id="submitHint"></p>
    <details class="fold"><summary id="previewLabel">会提交的内容</summary><pre class="out" id="preview"></pre></details>
  </footer>
</aside>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/console.js"></script>
</body>
</html>
