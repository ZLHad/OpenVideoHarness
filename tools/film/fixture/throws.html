<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=160, height=90"></head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<script>
  // bin/vh frames' fixture: a frame function that throws from t = 2 s on (exit 1, naming the t)
  const x = document.getElementById("c").getContext("2d");
  window.film = { duration: 3, frame(t) { if (t >= 2) throw new Error("no picture after 2 s"); x.fillStyle = "#246"; x.fillRect(0, 0, 160, 90); } };
</script>
</body>
</html>
