<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=160, height=90">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<script>
  // An edit list's fixture: a title card on its own clock (from 0, whatever film it is in), 2 s long: a bar that grows.
  const x = document.getElementById("c").getContext("2d");
  window.film = {
    duration: 2,
    frame(t) {
      x.fillStyle = "#223"; x.fillRect(0, 0, 160, 90);
      x.fillStyle = "#e8e2d0"; x.fillRect(10, 40, 140 * Math.min(1, t / 2), 10);
    },
  };
</script>
</body>
</html>
