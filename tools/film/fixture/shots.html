<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, height=180">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
  // bin/vh patch --shot / --chapter's fixture (tools/ci.sh): three shots, a colour each, and a 0.3 s dissolve into S03 that
  // draws S02 underneath it (so S02 is on screen until 2.5 s, past its end at 2.2 s); two chapters, the second with an id.
  const SHOTS = [
    { id: "S01", start: 0, end: 1.4, colour: "#c33" },
    { id: "S02", start: 1.4, end: 2.2, colour: "#3c3" },
    { id: "S03", start: 2.2, end: 3, colour: "#33c", transition: { type: "dissolve", duration: 0.3 } },
  ];
  const c = document.getElementById("c"), x = c.getContext("2d");
  const at = (t) => SHOTS.find((s) => t >= s.start && t < s.end) || SHOTS[SHOTS.length - 1];
  window.film = {
    duration: 3,
    fps: 30,
    get shots() { return SHOTS.map(({ id, start, end, transition }) => ({ id, start, end, ...(transition ? { transition } : {}) })); },
    get chapters() { return [{ t: 0, title: "one" }, { t: 1.4, title: "two", id: "ch-two" }]; },
    frame(t) {
      const s = at(t), i = SHOTS.indexOf(s), d = s.transition ? s.transition.duration : 0;
      x.globalAlpha = 1;
      if (d && t < s.start + d && i > 0) { x.fillStyle = SHOTS[i - 1].colour; x.fillRect(0, 0, 320, 180); x.globalAlpha = (t - s.start) / d; }
      x.fillStyle = s.colour; x.fillRect(0, 0, 320, 180);
      x.globalAlpha = 1; x.fillStyle = "#fff"; x.fillRect(20 + t * 80, 90, 20, 20);
    },
  };
</script>
</body>
</html>
