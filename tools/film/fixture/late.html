<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=160, height=90"></head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<script>
  // bin/vh frames' fixture: a frame that leaves a timer behind, which throws after the frame is captured (exit 1, "just
  // after the last frame")
  const x = document.getElementById("c").getContext("2d");
  window.film = { duration: 3, frame(t) { x.fillStyle = "#264"; x.fillRect(0, 0, 160, 90); if (t >= 2) setTimeout(() => { throw new Error("a late error"); }, 90); } };
</script>
</body>
</html>
